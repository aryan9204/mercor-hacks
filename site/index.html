<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Imaced — is the answer coming from the evidence?</title>
<style>
/* ===================================================================================================
   Design tokens. One neutral ramp (reading-room grays), one data hue, three status colors.
   Status colors are reserved for verdicts and always ship with an icon + label.
   =================================================================================================== */
:root {
  --bg: #0b0b0a;          --bg-raised: #131312;  --surface: #1a1a19;  --surface-2: #222220;  --surface-3: #2b2b29;
  --line: #2c2c2a;        --line-strong: #3a3a37;
  --ink: #f0efec;         --ink-2: #c3c2b7;      --ink-3: #9a998f;    --ink-4: #6f6e67;   /* ink-4: decorative strokes only (3.4:1) */
  --data: #3987e5;        --data-soft: rgba(57,135,229,.16);
  --abstain: #8d8c84;
  --good: #0ca30c;        --good-soft: rgba(12,163,12,.12);
  --warn: #fab219;        --warn-soft: rgba(250,178,25,.10);
  --crit: #e5484d;        --crit-soft: rgba(229,72,77,.12);
  --evidence: #fab219;    /* dashed outline of the dataset evidence box */
  --focus: #7fb2f0;

  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  --t-xs: 11px; --t-sm: 12px; --t-base: 14px; --t-md: 15px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 30px;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --shadow-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
  --shadow-pop: 0 0 0 1px var(--line-strong), 0 16px 48px rgba(0,0,0,.55);
  --ease: cubic-bezier(.2,.8,.2,1); --dur: 160ms;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--t-base)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.skip:focus { position: fixed; left: 12px; top: 12px; width: auto; height: auto; clip: auto; z-index: 60; padding: 8px 12px; background: var(--surface-2); border-radius: var(--r-sm); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 20px; height: 20px; }

/* ---------- Primitives ---------------------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; gap: var(--s-2); height: 32px; padding: 0 var(--s-3); border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-size: 13px; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform 80ms var(--ease); }
.btn:hover { background: var(--surface-2); color: var(--ink); border-color: #4a4a46; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; line-height: 16px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--r-md); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg [role=tab], .seg [role=radio] { border: 0; background: transparent; color: var(--ink-3); height: 28px; padding: 0 var(--s-3); border-radius: var(--r-sm);
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg [role=tab]:hover, .seg [role=radio]:hover { color: var(--ink); }
.seg [aria-selected=true], .seg [aria-checked=true] { background: var(--surface-3); color: var(--ink); box-shadow: var(--shadow-1); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--r-full); font-size: var(--t-xs);
  font-weight: 500; border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.badge svg.i { width: 12px; height: 12px; stroke-width: 2.5; }
.badge.good { color: #8ee08e; border-color: rgba(12,163,12,.45); background: var(--good-soft); }
.badge.good svg { color: var(--good); }
.badge.warn { color: #ffd77a; border-color: rgba(250,178,25,.45); background: var(--warn-soft); }
.badge.warn svg { color: var(--warn); }
.badge.crit { color: #ff9a9d; border-color: rgba(229,72,77,.5); background: var(--crit-soft); }
.badge.crit svg { color: var(--crit); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) var(--s-5) 0; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: var(--t-base); font-weight: 600; }
.card-b { padding: var(--s-4) var(--s-5) var(--s-5); }
.eyebrow { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }

/* ---------- App shell ----------------------------------------------------------------------------- */
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(11,11,10,.86); backdrop-filter: saturate(140%) blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1480px; margin: 0 auto; padding: var(--s-3) var(--s-6); display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: var(--s-2); text-decoration: none; color: var(--ink); }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--evidence); }
.brand b { font-size: var(--t-md); letter-spacing: .14em; }
.brand span { color: var(--ink-3); font-size: var(--t-sm); }
.grow { flex: 1; }
.searchbtn { min-width: 220px; justify-content: space-between; color: var(--ink-3); }
.searchbtn span.l { display: inline-flex; gap: var(--s-2); align-items: center; }
.gatebar { display: flex; align-items: center; gap: var(--s-2); }
.gatebar .lbl { font-size: var(--t-sm); color: var(--ink-3); }

main { max-width: 1480px; margin: 0 auto; padding: var(--s-6) var(--s-6) var(--s-10); outline: none; }
.view-enter { animation: enter 220ms var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Case screen --------------------------------------------------------------------------- */
.casebar { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-4); }
.casebar .nav { display: flex; align-items: center; gap: var(--s-2); }
.casebar .pos { font-size: var(--t-sm); color: var(--ink-3); min-width: 64px; text-align: center; }
.meta { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.qcard { padding: var(--s-5) var(--s-5) var(--s-4); }
.qtitle { font-size: var(--t-xl); line-height: 1.3; margin: var(--s-2) 0 var(--s-3); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.opts { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.opt { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 10px; border-radius: var(--r-sm); background: var(--bg-raised); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; }
.opt b { font-family: var(--mono); color: var(--ink-3); font-weight: 600; }
.opt.gt { border-color: rgba(12,163,12,.5); color: var(--ink); }
.opt.gt b, .opt.gt svg { color: #8ee08e; }
.why { margin-top: var(--s-3); color: var(--ink-3); font-size: 13px; }
.why .mono { color: var(--ink-2); }

.verdict { display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-4); align-items: center; margin: var(--s-4) 0; padding: var(--s-4) var(--s-5);
  border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }
.verdict::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--ink-4); }
.verdict .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); }
.verdict h2 { margin: 0; font-size: var(--t-md); letter-spacing: .06em; }
.verdict p { margin: 2px 0 0; color: var(--ink-2); }
.verdict p b { color: var(--ink); }
.verdict.good::before { background: var(--good); } .verdict.good .ic { color: var(--good); background: var(--good-soft); }
.verdict.warn::before { background: var(--warn); } .verdict.warn .ic { color: var(--warn); background: var(--warn-soft); }
.verdict.crit::before { background: var(--crit); } .verdict.crit .ic { color: var(--crit); background: var(--crit-soft); }
.ground { font-size: 13px; color: var(--ink-3); text-align: right; max-width: 300px; }
.ground b { color: var(--ink); font-weight: 600; }

.views { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-4); }
.vcard { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-3); border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); min-width: 0; }
.vcard.flag-crit { border-color: rgba(229,72,77,.65); box-shadow: 0 0 0 3px var(--crit-soft); }
.vcard.flag-warn { border-color: rgba(250,178,25,.55); box-shadow: 0 0 0 3px var(--warn-soft); }
.vhead { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-2); padding: 2px 2px 0; flex-wrap: wrap; }
.vhead h3 { margin: 0; font-size: 13px; font-weight: 600; }
.vhead small { font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; }
.stage { aspect-ratio: var(--stage, 1); display: grid; place-items: center; background: #000; border-radius: var(--r-md); overflow: hidden; }
.frame { position: relative; overflow: hidden; background: #000; aspect-ratio: var(--ar, 1); }
.frame.wide { width: 100%; } .frame.tall { height: 100%; }
.frame img, .frame svg.ph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.frame img { opacity: 0; transition: opacity 240ms var(--ease); }
.frame img.loaded { opacity: 1; }
.frame.loading { background: linear-gradient(100deg, #151514 30%, #1f1f1d 50%, #151514 70%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.frame svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.answer { display: flex; align-items: baseline; gap: var(--s-2); min-height: 26px; padding: 0 2px; min-width: 0; }
.answer .L { font-family: var(--mono); font-weight: 700; font-size: var(--t-md); width: 18px; flex: none; }
.answer .T { font-size: var(--t-md); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.answer .P { font-family: var(--mono); font-size: var(--t-sm); color: var(--ink-3); flex: none; }
.bars { display: grid; grid-template-columns: 22px 1fr 38px; gap: 5px 8px; align-items: center; font-size: var(--t-sm); padding: 0 2px; }
.bars .bl { font-family: var(--mono); color: var(--ink-3); }
.bars .bl.gt { color: var(--ink); }
.bars .tr { height: 8px; border-radius: 0 4px 4px 0; background: var(--surface-3); overflow: hidden; }
.bars .fi { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--data); transition: width 280ms var(--ease); }
.bars .fi.ab { background: var(--abstain); }
.bars .bv { font-family: var(--mono); text-align: right; color: var(--ink-2); }
.vfoot { display: flex; flex-direction: column; gap: 4px; padding: var(--s-2) 2px 0; border-top: 1px solid var(--line); font-size: var(--t-sm); }
.kv { display: flex; justify-content: space-between; gap: var(--s-2); color: var(--ink-3); min-width: 0; }
.kv > span:first-child { flex: none; }
.kv .mono { color: var(--ink-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.empty { display: grid; place-content: center; justify-items: center; text-align: center; gap: var(--s-2); padding: var(--s-6) var(--s-3); border: 1px dashed var(--line-strong); border-radius: var(--r-md);
  color: var(--ink-3); font-size: var(--t-sm); aspect-ratio: var(--ar, 1); }
.empty svg { color: var(--ink-4); }
.legend { display: flex; gap: var(--s-4); flex-wrap: wrap; margin-top: var(--s-4); font-size: var(--t-sm); color: var(--ink-3); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 10px; vertical-align: -1px; margin-right: 6px; border-radius: 2px; }

/* ---------- Scoreboard ---------------------------------------------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s-3); margin-bottom: var(--s-4); }
.tile { padding: var(--s-4); }
.tile .n { font: 600 var(--t-2xl)/1.1 var(--mono); letter-spacing: -.02em; margin-top: var(--s-2); }
.tile .d { color: var(--ink-3); font-size: var(--t-sm); margin-top: var(--s-1); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--s-4); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--ink-3); font-weight: 500; font-size: var(--t-sm); }
thead th small { display: block; color: var(--ink-3); font-weight: 400; }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td:first-child { font-family: var(--font); color: var(--ink-2); white-space: normal; min-width: 150px; }
td .ci { display: block; color: var(--ink-3); font-size: var(--t-xs); }
tr.after td:first-child { color: var(--ink); }
.note { color: var(--ink-3); font-size: var(--t-sm); margin: var(--s-3) 0 0; }
.callout { margin-top: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); background: var(--bg-raised); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.callout b { color: var(--ink); }
#sc circle { cursor: pointer; }
#sc circle:hover { r: 8; }
#sc circle:focus { outline: none; stroke: var(--focus); stroke-width: 3; r: 8; }

/* ---------- Gallery ------------------------------------------------------------------------------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-3); }
.field { display: inline-flex; align-items: center; gap: var(--s-2); height: 32px; padding: 0 var(--s-3); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-3); min-width: 260px; }
.field input { background: transparent; border: 0; outline: 0; color: var(--ink); width: 100%; min-width: 0; }
.field:focus-within { border-color: var(--focus); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: var(--s-3); }
.gcard { text-align: left; padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease), background var(--dur) var(--ease); min-width: 0; }
.gcard:hover { border-color: var(--line-strong); background: var(--surface-2); transform: translateY(-1px); }
.gcard .t { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 39px; }
.gcard .id { font-family: var(--mono); font-size: var(--t-xs); color: var(--ink-3); }
.gcard .row { display: flex; gap: 6px; flex-wrap: wrap; }
.count { font-size: var(--t-sm); color: var(--ink-3); margin: 0 0 var(--s-3); }
.emptystate { grid-column: 1 / -1; padding: var(--s-10) var(--s-4); text-align: center; color: var(--ink-3); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); }

/* ---------- Overlays: command menu, dialog, tooltip, toast ---------------------------------------- */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: min(720px, calc(100vw - 32px)); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog[open] { animation: pop 160ms var(--ease) both; }
dialog[open]::backdrop { animation: fade 160ms var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); overflow: hidden; }
.cmd-in { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-4); border-bottom: 1px solid var(--line); color: var(--ink-3); }
.cmd-in input { flex: 1; min-width: 0; height: 52px; background: transparent; border: 0; outline: 0; font-size: var(--t-md); color: var(--ink); }
.cmd-list { max-height: min(420px, 60vh); overflow-y: auto; padding: var(--s-2); margin: 0; list-style: none; }
.cmd-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; padding: 9px var(--s-3); border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); }
.cmd-list li:hover { background: var(--surface-2); }
.cmd-list li[aria-selected=true] { background: var(--surface-3); color: var(--ink); }
.cmd-list li .id { font-family: var(--mono); font-size: var(--t-sm); color: var(--ink-3); }
.cmd-list li .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.cmd-list li.cmd-empty { display: block; padding: var(--s-8) var(--s-4); text-align: center; color: var(--ink-3); cursor: default; }
.cmd-foot { display: flex; gap: var(--s-4); padding: var(--s-2) var(--s-4); border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--ink-3); }
.dlg-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); }
.dlg-h h2 { margin: 0; font-size: var(--t-md); }
.dlg-b { padding: var(--s-4) var(--s-5) var(--s-5); max-height: min(70vh, 720px); overflow-y: auto; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.55 var(--mono); color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); padding: var(--s-3); border-radius: var(--r-md); }
.prehead { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); margin: var(--s-4) 0 var(--s-2); }
.prehead h3 { margin: 0; font-size: var(--t-sm); color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tip { position: fixed; z-index: 40; left: 0; top: 0; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line-strong); padding: var(--s-2) var(--s-3); border-radius: var(--r-md);
  font-size: var(--t-sm); max-width: 320px; box-shadow: var(--shadow-pop); opacity: 0; transition: opacity 100ms var(--ease); }
.tip.on { opacity: 1; }
.toast { position: fixed; z-index: 50; left: 50%; bottom: var(--s-6); transform: translate(-50%, 12px); opacity: 0; display: flex; gap: var(--s-2); align-items: center;
  background: var(--surface-2); border: 1px solid var(--line-strong); padding: 10px var(--s-4); border-radius: var(--r-md); box-shadow: var(--shadow-pop); font-size: 13px;
  transition: opacity 160ms var(--ease), transform 160ms var(--ease); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast svg { color: var(--good); }
.foot { color: var(--ink-3); font-size: var(--t-sm); margin-top: var(--s-6); max-width: 980px; }

/* ---------- Responsive ---------------------------------------------------------------------------- */
@media (max-width: 1180px) { .views { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .topbar-in { padding: var(--s-3) var(--s-4); gap: var(--s-3); }
  .brand span { display: none; }
  .grow { display: none; }
  .searchbtn { min-width: 0; margin-left: auto; } .searchbtn .kbd, .searchbtn .t { display: none; }
  .gatebar { order: 5; width: 100%; }
  .gatebar .lbl { display: none; }
  main { padding: var(--s-4) var(--s-4) var(--s-8); }

<script>
"use strict";
const D = window.IMACED;
const S = D && D.summary;
const VIEW_ORDER = ["full", "out", "evid", "rand"];
const VIEW_NAME = { full: "Full image", out: "Surroundings masked", evid: "Evidence masked", rand: "Random region masked" };
const VIEW_SUB = { full: "should answer", out: "should answer · box kept", evid: "should abstain", rand: "should answer · control" };
const GATES = [["off", "Before"], ["logit", "Logit edit"], ["conf", "Confidence"]];
const TABS = [["case", "Case", "i-case"], ["score", "Scoreboard", "i-chart"], ["gallery", "Gallery", "i-grid"]];
const state = { tab: "case", gate: "off", idx: 0, filter: "all", q: "" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f2 = x => (x == null || Number.isNaN(+x)) ? "–" : (+x).toFixed(2);
const pct = x => (x == null || Number.isNaN(+x)) ? "–" : Math.round(100 * x) + "%";
const signed = x => (x >= 0 ? "+" : "") + f2(x);
const icon = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

/* ---------------- model of the check ---------------- */
function gateAbstains(v, gate = state.gate) {
  if (gate === "logit") return !!v.gate_logit_abstain;
  if (gate === "conf") return !!v.gate_conf_abstain;
  return false;
}
function caseStatus(c, gate = state.gate) {
  const ev = c.views.evid;
  if (!ev) return { cls: "", key: "na", fa: [] };
  if (gate === "off") return ev.correct ? { cls: "warn", key: "answered", fa: [] } : { cls: "crit", key: "wrong", fa: [] };
  const fa = VIEW_ORDER.filter(k => k !== "evid" && c.views[k] && gateAbstains(c.views[k], gate));
  if (!gateAbstains(ev, gate)) return { cls: "crit", key: "missed", fa };
  return fa.length ? { cls: "warn", key: "caught_fa", fa } : { cls: "good", key: "caught", fa };
}
function withBias(probs, ab, b) {
  // Exact logit edit: add b to the abstain option's log-prob and renormalize over the option letters.
  const lp = Object.fromEntries(Object.entries(probs).map(([L, p]) => [L, Math.log(p) + (L === ab ? b : 0)]));
  const m = Math.max(...Object.values(lp)), z = Object.values(lp).reduce((s, x) => s + Math.exp(x - m), 0);
  return Object.fromEntries(Object.entries(lp).map(([L, x]) => [L, Math.exp(x - m) / z]));
}

/* ---------------- routing: #case/12834, #score, #gallery ---------------- */
function readHash() {

  if (TABS.some(t => t[0] === tab)) state.tab = tab;
  if (id) { const i = D.cases.findIndex(c => String(c.ds_index) === id); if (i >= 0) state.idx = i; }
}
function go(tab, idx = state.idx) {
  state.tab = tab; state.idx = idx;
  const h = tab === "case" ? `#case/${D.cases[idx].ds_index}` : `#${tab}`;
  if (location.hash !== h) history.pushState(null, "", h);
  render(true);
}
window.addEventListener("popstate", () => { readHash(); render(true); });

/* ---------------- shell ---------------- */
function shell() {
  $("#tabs").innerHTML = TABS.map(([k, l, ic]) =>
    `<button role="tab" id="tab-${k}" aria-controls="main" aria-selected="${state.tab === k}" tabindex="${state.tab === k ? 0 : -1}" data-tab="${k}" aria-label="${l}">${icon(ic, "sm")}<span class="t">${l}</span></button>`).join("");
  $("#gates").innerHTML = GATES.map(([k, l]) =>
    `<button role="radio" aria-checked="${state.gate === k}" tabindex="${state.gate === k ? 0 : -1}" data-gate="${k}">${l}</button>`).join("");
}
function rovingKeys(container, attr, onPick) {
  container.addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    const items = [...container.querySelectorAll(`[${attr}]`)];
    let i = items.indexOf(document.activeElement);
    i = e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + items.length) % items.length;
    const key = items[i].getAttribute(attr);
    e.preventDefault(); onPick(key);
    container.querySelector(`[${attr}="${key}"]`).focus();
  });

/* ---------------- shared drawing ---------------- */
function overlay(c, view) {
  const [W, H] = c.img_size, sw = Math.max(2, W / 220);
  const r = (b, a) => b ? `<rect x="${b[0]}" y="${b[1]}" width="${b[2] - b[0]}" height="${b[3] - b[1]}" ${a}/>` : "";
  let s = r(c.box_px, `fill="none" stroke="#fab219" stroke-width="${sw}" stroke-dasharray="${W / 60} ${W / 90}"`);
  if (view === "rand") s += r(c.rand_box_px, `fill="none" stroke="#c3c2b7" stroke-width="${sw}"`);

  let s = `<rect width="${W}" height="${H}" fill="${bg}"/>`;
  if (view === "evid") s += rect(c.box_px, g);
  if (view === "rand") s += rect(c.rand_box_px, g);

/* ---------------- case screen ---------------- */
function viewCard(c, k) {
  const v = c.views[k];

  const ab = gateAbstains(v), on = state.gate !== "off";

function verdict(c) {

    missed: ["i-xcircle", "Missed", `The gate let the evidence-masked answer through (held-out ${thr}).${fa}`],
    caught: ["i-shield", "Caught", `Imaced abstains on the evidence-masked image and answers on every view where the evidence is visible (held-out ${thr}).`],

}

async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }

}

/* ---------------- scoreboard ---------------- */
function scatter() {
  const pts = D.cases.map((c, i) => ({ c, i })).filter(p => p.c.views.evid && p.c.views.rand)
    .map(p => ({ ...p, x: p.c.views.rand.d_logp_answer, y: p.c.views.evid.d_logp_answer }));
  const W = 520, H = 420, P = { l: 56, r: 18, t: 18, b: 52 };
  const all = pts.flatMap(p => [p.x, p.y]);
  const lo = Math.floor(Math.min(-2, ...all) * 2) / 2 - 0.1, hi = Math.max(0.5, ...all) + 0.1;
  const sx = v => P.l + (v - lo) / (hi - lo) * (W - P.l - P.r), sy = v => H - P.b - (v - lo) / (hi - lo) * (H - P.t - P.b);
  const ticks = []; for (let t = Math.ceil(lo * 2) / 2; t <= hi; t += 0.5) ticks.push(+t.toFixed(1));
  let g = `<polygon points="${sx(lo)},${sy(lo)} ${sx(hi)},${sy(hi)} ${sx(hi)},${sy(lo)}" fill="rgba(57,135,229,.06)"/>`;
  g += ticks.map(t => `<line x1="${sx(t)}" x2="${sx(t)}" y1="${P.t}" y2="${H - P.b}" stroke="#2c2c2a"/><line y1="${sy(t)}" y2="${sy(t)}" x1="${P.l}" x2="${W - P.r}" stroke="#2c2c2a"/>
    <text x="${sx(t)}" y="${H - P.b + 18}" fill="#9a998f" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">${t}</text>
    <text x="${P.l - 8}" y="${sy(t) + 4}" fill="#9a998f" font-size="11" text-anchor="end" font-family="ui-monospace,monospace">${t}</text>`).join("");
  g += `<line x1="${sx(lo)}" y1="${sy(lo)}" x2="${sx(hi)}" y2="${sy(hi)}" stroke="#6f6e67" stroke-dasharray="4 4"/>`;
  g += `<text x="${sx(hi) - 8}" y="${sy(lo) - 10}" fill="#c3c2b7" font-size="12" text-anchor="end">Below the line: masking the evidence hurt more</text>`;
  g += pts.map(p => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2" tabindex="0" role="button" data-i="${p.i}"
      aria-label="Case ${p.c.ds_index}: evidence ${f2(p.y)}, random ${f2(p.x)}. Open case."/>`).join("");
  g += `<text x="${(W + P.l) / 2}" y="${H - 12}" fill="#c3c2b7" font-size="12" text-anchor="middle">Δ log p(answer) · random region masked</text>
    <text transform="translate(16 ${(H - P.b + P.t) / 2}) rotate(-90)" fill="#c3c2b7" font-size="12" text-anchor="middle">Δ log p(answer) · evidence masked</text>`;
  return `<svg id="sc" viewBox="0 0 ${W} ${H}" width="100%" role="group" aria-label="Scatter: change in log-probability, evidence masked versus random region masked, one dot per case">${g}</svg>`;
}
function scoreView() {
  const b = S.before, a = S.after_crossfit, acc = b.no_abstain_option.accuracy;
  const vs = ["full", "out", "rand", "evid"].filter(v => acc[v] !== undefined);
  const cell = o => o ? `${pct(o.mean)}<span class="ci">${pct(o["p2.5"])}–${pct(o["p97.5"])}</span>` : "–";
  const tile = (n, l, d) => `<div class="card tile"><div class="eyebrow">${l}</div><div class="n">${n}</div><div class="d">${d}</div></div>`;
  const W = S.wrong_answers_with_evidence_masked;
  return `
  <div class="tiles">
    ${vs.map(v => tile(pct(acc[v]), "Accuracy", VIEW_NAME[v])).join("")}
    ${tile(`${W.n}/${S.n_examples}`, "Wrong when masked", "switch to a wrong option once the evidence is gray")}
    ${tile(f2(S.threshold_free_auroc.neg_conf_evid_vs_rand), "AUROC", "low confidence: evidence-masked vs random-masked")}
  </div>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>How often the model abstains</h2><span class="badge">held-out · ${a.n_splits} splits</span></div>
      <div class="card-b">
        <div class="tablewrap"><table>
          <thead><tr><th scope="col"><span class="sr-only">Condition</span></th>${vs.map(v => `<th scope="col">${VIEW_NAME[v]}<small>${v === "evid" ? "want 100%" : "want 0%"}</small></th>`).join("")}</tr></thead>
          <tbody>
            <tr><td>Before · plain question</td>${vs.map(v => `<td>${pct(b.no_abstain_option.abstain_rate[v])}</td>`).join("")}</tr>
            <tr class="after"><td>After · confidence threshold</td>${vs.map(v => `<td>${cell(a.conf_gate_abstain_rate[v])}</td>`).join("")}</tr>
            <tr class="after"><td>After · abstain-logit edit</td>${vs.map(v => `<td>${cell(a.logit_gate_abstain_rate && a.logit_gate_abstain_rate[v])}</td>`).join("")}</tr>
          </tbody></table></div>
        <p class="note">After rows: each half of the cases gets a threshold fit on the other half (Youden's J: abstain on evidence-masked, answer on full and random-masked), repeated over ${a.n_splits} random splits. Mean, with the 2.5th–97.5th percentile below.</p>
        <div class="callout"><b>Grounding check</b> (no fitted parameters): ${pct(S.grounding_check.frac_grounded)} of answers lose more log-probability when the evidence is masked than when an equal-size random region is masked. Mean ${f2(S.grounding_check.mean_d_evid)} vs ${f2(S.grounding_check.mean_d_rand)}, Wilcoxon p = ${S.grounding_check.wilcoxon_p_d_evid_vs_d_rand.toFixed(4)}.</div>
        <div class="callout">${S.self_box ? `<b>Label-free mode</b> (Qwen proposes its own box): mean IoU with the dataset box ${f2(S.self_box.mean_iou_with_dataset_box)}; grounded ${pct(S.self_box.frac_grounded_label_free)}; agrees with the dataset-box verdict ${pct(S.self_box.agreement_with_dataset_box_verdict)}.` : `<b>Label-free mode</b> (Qwen proposes its own evidence box) is coded but not in this run.`}</div>
      </div></section>
    <section class="card"><div class="card-h"><h2>Did the answer depend on the evidence?</h2><span class="muted" style="font-size:12px">one dot per case · click to open</span></div>
      <div class="card-b">${scatter()}</div></section>
  </div>
  <p class="foot">Sample: ${S.n_examples} cases, from ${S.n_examples_in_csv} that passed a screen of 1000 shuffled ViTAR-16K classification questions (kept only if Qwen answers the full image correctly with p ≥ 0.5 and the image at least doubles p(correct) over the question alone). Spine “Is there stenosis at L4-L5?” items are excluded: they are yes/no questions with an escape option. The ground truth for the check is physical: in the evidence-masked view the labelled region is painted gray, so abstaining is correct whatever the diagnosis.</p>`;
}

/* ---------------- gallery ---------------- */
const FILTERS = [["all", "All"], ["wrong", "Wrong when masked"], ["caught", "Caught"], ["missed", "Missed"], ["fa", "False alarm"]];
function galleryMatches(c, gate) {
  const st = caseStatus(c, gate), f = state.filter, q = state.q.trim().toLowerCase();
  const ok = f === "all" || (f === "wrong" && !c.views.evid.correct) || (f === "caught" && st.key.startsWith("caught")) ||
    (f === "missed" && st.key === "missed") || (f === "fa" && st.fa.length > 0);
  return ok && matchesText(c, q);
}
// Case number, question, or any answer option (e.g. "glioma", "implant").
const matchesText = (c, q) => !q || String(c.ds_index).includes(q) || c.question.toLowerCase().includes(q) ||
  c.options.some(([, t]) => t.toLowerCase().includes(q));
function galleryView() {
  const gate = state.gate === "off" ? "conf" : state.gate;
  const items = D.cases.map((c, i) => [c, i]).filter(([c]) => galleryMatches(c, gate));
  const label = { caught: "Caught", caught_fa: "Caught + false alarm", missed: "Missed" };
  return `
  <div class="toolbar">
    <div class="seg" role="radiogroup" aria-label="Filter cases" id="gf">${FILTERS.map(([k, l]) => `<button role="radio" aria-checked="${state.filter === k}" tabindex="${state.filter === k ? 0 : -1}" data-f="${k}">${l}</button>`).join("")}</div>
    <label class="field">${icon("i-search", "sm")}<span class="sr-only">Filter by text</span><input id="gq" type="search" placeholder="Filter by number, question or option" value="${esc(state.q)}"></label>
  </div>
  <p class="count" aria-live="polite">${items.length} of ${D.cases.length} cases · verdicts use the ${gate === "conf" ? "confidence threshold" : "abstain-logit edit"} gate${state.gate === "off" ? " (pick a gate above to switch)" : ""}</p>
  <div class="gallery">${items.length ? items.map(([c, i]) => {
    const st = caseStatus(c, gate), ev = c.views.evid;
    const [cls, ic] = st.key === "missed" ? ["crit", "i-x"] : st.key === "caught" ? ["good", "i-check"] : ["warn", "i-alert"];
    return `<button class="gcard" data-i="${i}" aria-label="Open case ${c.ds_index}: ${esc(c.question)}">
      ${frame(c, "evid", ev.img, 4 / 3)}
      <span class="id">#${c.ds_index}</span><span class="t">${esc(c.question)}</span>
      <span class="row">${ev.correct ? badge("ans_noev") : badge("wrong_noev")}<span class="badge ${cls}">${icon(ic)}${label[st.key]}</span></span>
    </button>`;
  }).join("") : `<div class="emptystate">No cases match. <button class="btn" data-act="clear" style="margin-left:8px">Clear filters</button></div>`}</div>`;
}

/* ---------------- render + events ---------------- */
function render(animate = false) {
  hideTip();

  m.innerHTML = state.tab === "case" ? caseView() : state.tab === "score" ? scoreView() : galleryView();
  if (animate) { m.classList.remove("view-enter"); void m.offsetWidth; m.classList.add("view-enter"); }
  document.title = state.tab === "case" ? `#${D.cases[state.idx].ds_index} · Imaced` : `${TABS.find(t => t[0] === state.tab)[1]} · Imaced`;
}
const step = d => go("case", (state.idx + d + D.cases.length) % D.cases.length);
$("#main").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"), g = e.target.closest(".gcard"), f = e.target.closest("[data-f]"), dot = e.target.closest("#sc circle");
  if (a) {

  if (g) go("case", +g.dataset.i);

  if (e.target.id !== "gq") return;

});
$("#main").addEventListener("keydown", e => {
  const dot = e.target.closest && e.target.closest("#sc circle");
  if (dot && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); hideTip(); go("case", +dot.dataset.i); return; }
  if (e.target.closest && e.target.closest("#gf") && ["ArrowLeft", "ArrowRight"].includes(e.key)) {
    const i = FILTERS.findIndex(x => x[0] === state.filter), n = FILTERS.length;
    state.filter = FILTERS[(i + (e.key === "ArrowRight" ? 1 : -1) + n) % n][0];

  }
});
const tip = $("#tip");
function showTip(dot, x, y) {
  const c = D.cases[+dot.dataset.i];
  tip.innerHTML = `<b class="mono">#${c.ds_index}</b> ${esc(c.question)}<br><span class="muted">Δ evidence</span> <span class="mono">${f2(c.views.evid.d_logp_answer)}</span> · <span class="muted">Δ random</span> <span class="mono">${f2(c.views.rand.d_logp_answer)}</span><br><span class="muted">Answer with evidence masked:</span> ${esc(c.views.evid.pred_text)} (${c.views.evid.correct ? "same as label" : "wrong"})`;
  tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  tip.style.transform = `translate(${Math.min(x + 14, innerWidth - r.width - 8)}px, ${Math.min(y + 14, innerHeight - r.height - 8)}px)`;
}
function hideTip() { tip.classList.remove("on"); }
$("#main").addEventListener("mousemove", e => { const d = e.target.closest("#sc circle"); d ? showTip(d, e.clientX, e.clientY) : hideTip(); });
$("#main").addEventListener("focusin", e => { const d = e.target.closest("#sc circle"); if (d) { const r = d.getBoundingClientRect(); showTip(d, r.right, r.bottom); } });
$("#main").addEventListener("focusout", hideTip);
document.addEventListener("keydown", e => {
  if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("#cmd").open ? $("#cmd").close() : openCmd(); return; }
  if (document.querySelector("dialog[open]")) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); openCmd(); return; }
  if (state.tab !== "case" || typing || (e.target.closest && e.target.closest("[role=tablist],[role=radiogroup]"))) return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

if (!D) {
  $("#main").innerHTML = `<div class="emptystate">No data found. Run <span class="mono">python imaced_verify.py results site</span> to create <span class="mono">site/cases.js</span>.</div>`;
} else {
  state.idx = Math.max(0, D.cases.findIndex(c => c.ds_index === 12834));
  readHash();
  render();
}
</script>
</body>
</html>
